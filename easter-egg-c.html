<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>Easter egg — C · Keycap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
*{box-sizing:border-box}
:root{--bg:#fcfcfd;--panel:#fff;--panel-2:#f6f7f9;--line:#e7e8ec;--text:#14161a;--muted:#676b74;--accent:#4f57c9;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#08090a;--panel:#0e0f11;--panel-2:#16181b;--line:#1e2024;--text:#f4f5f6;--muted:#8b8f98;--accent:#7b86e8;--accent-ink:#0b0c0d}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}
.stage{display:flex;flex-direction:column;align-items:center;gap:26px}
.key{width:128px;height:128px;border-radius:26px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:500;line-height:1;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 10px 26px -12px color-mix(in srgb,var(--accent) 70%,transparent);
  animation:press .5s cubic-bezier(.2,.9,.2,1) both}
.meta{display:flex;flex-direction:column;align-items:center;gap:7px;animation:fade .6s .2s both}
.name{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sub{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.heart{display:block;fill:var(--accent)}
@keyframes press{0%{opacity:0;transform:scale(.88) translateY(8px)}55%{transform:scale(1.015) translateY(0)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.key,.meta{animation:none}}
</style>
</head>
<body>
<div class="stage">
<div class="key">&#8721;</div>
<div class="meta">
<p class="name">Jay</p>
<p class="sub"><svg class="heart" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.7c-.38 0-.75-.14-1.04-.4C6.45 16.3 3.2 13.4 3.2 9.75 3.2 7.1 5.3 5 7.85 5c1.66 0 3.2.88 4.15 2.28C12.95 5.88 14.5 5 16.15 5 18.7 5 20.8 7.1 20.8 9.75c0 3.65-3.25 6.55-7.76 10.55-.29.26-.66.4-1.04.4z"/></svg>indie dev</p>
</div>
</div>
</body>
</html>
